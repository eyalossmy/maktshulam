<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>מקטשולם</title>
  <meta name="description" content="מקטשולם — ניהול מק״טים פשוט: שם, מק״ט ותמונה, בלי כפילויות.">
  <meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D0D0F" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=Google+Sans+Code:wght@500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="מקטשולם">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="12" fill="currentColor"/>
        <g fill="var(--bg)">
          <rect x="9" y="11" width="2.5" height="18" rx="1"/>
          <rect x="14" y="11" width="1.5" height="18" rx=".75"/>
          <rect x="18" y="11" width="4" height="18" rx="1"/>
          <rect x="24.5" y="11" width="1.5" height="18" rx=".75"/>
          <rect x="28.5" y="11" width="2.5" height="18" rx="1"/>
        </g>
      </svg>
      <span class="brand-text">
        <span class="brand-name">מקטשולם</span>
        <span class="brand-sub">ניהול מק״טים</span>
      </span>
    </a>
    <div class="top-actions">
      <div class="menu-wrap">
        <button id="menuBtn" class="icon-btn" type="button" aria-label="אפשרויות נוספות" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
        <div id="menu" class="menu" role="menu" hidden>
          <button type="button" role="menuitem" data-action="export">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            ייצוא גיבוי
          </button>
          <button type="button" role="menuitem" data-action="import">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            ייבוא גיבוי
          </button>
        </div>
      </div>
      <button id="addBtn" class="btn primary" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>פריט חדש</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1 class="headline">כל מק״ט —<br><span>פעם אחת בלבד.</span></h1>
      <div class="stats" aria-live="polite">
        <div class="stat"><strong id="count">0</strong><span>פריטים</span></div>
        <div class="stat"><strong id="photoCount">0</strong><span>עם תמונה</span></div>
      </div>
    </section>

    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="search" type="search" placeholder="חיפוש לפי שם או מק״ט" autocomplete="off" spellcheck="false">
        <kbd aria-hidden="true">/</kbd>
      </label>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>

    <div id="empty" class="empty" hidden>
      <div class="empty-art" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <h2>עוד אין פריטים</h2>
      <p>הוסיפו את הפריט הראשון: שם, מק״ט ותמונה. כפילויות ייחסמו אוטומטית.</p>
      <button type="button" class="btn primary" data-action="add">הוספת פריט ראשון</button>
    </div>

    <div id="noResults" class="empty small" hidden>
      <h2>לא נמצאו תוצאות</h2>
      <p>נסו מילה אחרת או חלק מהמק״ט.</p>
    </div>
  </main>

  <dialog id="editor" class="sheet" aria-labelledby="formTitle">
    <form id="form" novalidate>
      <div class="sheet-head">
        <h2 id="formTitle">פריט חדש</h2>
        <button type="button" class="icon-btn" data-close aria-label="סגירה">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div id="drop" class="drop" role="button" tabindex="0" aria-label="הוספת תמונה">
        <input id="photo" type="file" accept="image/*" hidden>
        <img id="preview" alt="" hidden>
        <div class="drop-empty">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg>
          <strong>הוספת תמונה</strong>
          <span>גררו לכאן, הדביקו או לחצו לבחירה</span>
        </div>
        <button id="clearPhoto" type="button" class="chip-btn" hidden>הסרת תמונה</button>
        <div class="drop-busy" hidden><span class="spinner"></span></div>
      </div>
      <p id="photoMsg" class="msg" aria-live="polite"></p>

      <div class="field" id="nameField">
        <label for="name">שם הפריט</label>
        <div class="control">
          <input id="name" name="name" autocomplete="off" maxlength="80" placeholder="לדוגמה: כוס זכוכית 350 מ״ל">
          <span class="status" aria-hidden="true"></span>
        </div>
        <p id="nameMsg" class="msg" aria-live="polite"></p>
      </div>

      <div class="field" id="skuField">
        <label for="sku">מק״ט</label>
        <div class="control">
          <input id="sku" name="sku" class="code" dir="ltr" autocomplete="off" spellcheck="false" maxlength="40" placeholder="MK-10024">
          <span class="status" aria-hidden="true"></span>
          <button id="genSku" type="button" class="chip-btn">יצירה אוטומטית</button>
        </div>
        <p id="skuMsg" class="msg" aria-live="polite"></p>
      </div>

      <div class="sheet-foot">
        <button id="deleteBtn" type="button" class="btn danger" hidden>מחיקה</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>ביטול</button>
        <button id="saveBtn" type="submit" class="btn primary">שמירה</button>
      </div>
    </form>
  </dialog>

  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
